<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruiterVision AI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar layout */
        .sidebar {
            width: 260px;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e293b;
        }
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            letter-spacing: -0.025em;
        }
        .sidebar-brand span {
            color: #3b82f6;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .sidebar-menu li a.active, .sidebar-menu li a:hover {
            background-color: #1e3a8a;
            color: #ffffff;
        }
        
        /* Main Workspace */
        .main-content {
            flex: 1;
            padding: 2.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 0.875rem;
        }

        /* Responsive Grid Panels */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
        }
        .card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }
        
        /* Upload Area Drag & Drop Component */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 3.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }
        .upload-zone:hover {
            border-color: #2563eb;
            background-color: rgba(37, 99, 235, 0.01);
        }
        .upload-zone p {
            font-size: 0.95rem;
            color: #64748b;
            margin-top: 0.5rem;
        }
        .upload-zone span {
            color: #2563eb;
            font-weight: 600;
        }

        /* Form Inputs */
        .jd-input {
            width: 100%;
            height: 130px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-top: 1rem;
            resize: none;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .jd-input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        .action-btn {
            margin-top: 1.5rem;
            padding: 0.8rem 1.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .action-btn:hover {
            background-color: #1d4ed8;
        }

        /* Side Activity Metrics */
        .stats-panel {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .stat-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-box .title {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 500;
        }
        .stat-box .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3a8a;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">RecruiterVision<span>AI</span></div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Analysis History</a></li>
            <li><a href="#">Skill Intelligence</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Workspace</h1>
            <div class="user-profile">
                <div class="avatar">U</div>
                <span style="font-weight: 500; font-size: 0.95rem; color: #334155;">Active User</span>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>New Analysis Pipeline</h3>
                <div class="upload-zone">
                    <p>Drag and drop applicant resume here, or <span>browse files</span></p>
                    <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Supports PDF or standard text documents</p>
                </div>
                
                <div style="margin-top: 1.5rem;">
                    <label style="font-size: 0.875rem; font-weight: 500; color: #475569;">Target Job Description (JD) Matrix</label>
                    <textarea class="jd-input" placeholder="Paste structural job description fields here for system semantic analysis..."></textarea>
                </div>

                <button class="action-btn">Execute Matching Algorithm</button>
            </div>

            <div class="stats-panel">
                <div class="stat-box">
                    <div>
                        <div class="title">Total Scanned</div>
                        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Lifetime count</div>
                    </div>
                    <div class="value">0</div>
                </div>
                <div class="stat-box">
                    <div>
                        <div class="title">Mean ATS Match</div>
                        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Percentage ratio</div>
                    </div>
                    <div class="value">--</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
